{% extends "base.html" %}
{% block title %}Sign In - Placement Portal{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 p-3 p-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                <h3 class="fw-bold mt-2">Sign In</h3>
                <p class="text-muted small">Access your student or administrator dashboard</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@test.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>

            <div class="alert alert-light border mt-4 mb-0 small">
                <div class="fw-bold text-dark mb-1"><i class="bi bi-info-circle me-1"></i>Demo Test Credentials:</div>
                <div class="d-flex justify-content-between mb-1">
                    <span><strong>Admin:</strong> admin@test.com</span>
                    <code>admin123</code>
                </div>
                <div class="d-flex justify-content-between">
                    <span><strong>Student:</strong> student@test.com</span>
                    <code>student123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
